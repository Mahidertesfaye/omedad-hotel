<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="restaurant-bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="45%" stop-color="#0b1628"/>
      <stop offset="100%" stop-color="#060e1a"/>
    </linearGradient>
    <linearGradient id="restaurant-glow" x1="300" y1="80" x2="900" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="restaurant-spot" cx="600" cy="380" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#restaurant-bg)"/>
  <rect width="1200" height="900" fill="url(#restaurant-glow)"/>
  <ellipse cx="600" cy="380" rx="420" ry="280" fill="url(#restaurant-spot)"/>
  <rect x="140" y="520" width="920" height="12" rx="1" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="200" y="560" width="320" height="200" rx="2" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" fill="#ffffff" fill-opacity="0.02"/>
  <rect x="560" y="560" width="320" height="200" rx="2" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" fill="#ffffff" fill-opacity="0.02"/>
  <circle cx="600" cy="340" r="80" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" fill="#ffffff" fill-opacity="0.03"/>
  <line x1="520" y1="340" x2="680" y2="340" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="600" y1="260" x2="600" y2="420" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="600" y="460" text-anchor="middle" fill="#ffffff" fill-opacity="0.16" font-family="Georgia, serif" font-size="24" letter-spacing="8">THE GRAND TABLE</text>
  <text x="600" y="500" text-anchor="middle" fill="#ffffff" fill-opacity="0.08" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">RESTAURANT - PLACEHOLDER</text>
</svg>
