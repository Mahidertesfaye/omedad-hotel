      <stop offset="0%" stop-color="#1e3048"/>
      <stop offset="50%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0b1628"/>
    </linearGradient>
    <linearGradient id="room-light" x1="120" y1="80" x2="840" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
