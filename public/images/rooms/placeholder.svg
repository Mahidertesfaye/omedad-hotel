  <rect x="520" y="120" width="360" height="240" rx="2" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" fill="#ffffff" fill-opacity="0.02"/>
  <line x1="80" y1="420" x2="880" y2="420" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <text x="480" y="340" text-anchor="middle" fill="#ffffff" fill-opacity="0.16" font-family="Georgia, serif" font-size="22" letter-spacing="6">OMEDAD HOTEL</text>
  <text x="480" y="375" text-anchor="middle" fill="#ffffff" fill-opacity="0.08" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">ROOM PLACEHOLDER</text>
